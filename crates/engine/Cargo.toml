[package]
name = "pdfmd-lite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
image.workspace = true
lopdf.workspace = true
pdf-extract.workspace = true
sha2.workspace = true
hayro.workspace = true
indicatif.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
dunce.workspace = true
dirs = { workspace = true }
toml.workspace = true
zip = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
tract-onnx.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[features]
default = ["slanet-ort", "latex-ort", "gliner-ort", "tokenizers-support", "embed-ort", "directml"]
ort = ["dep:ort"]
directml = ["ort/directml"]
slanet-ort = ["ort"]
latex-ort = ["ort"]
gliner-ort = ["ort"]
tokenizers-support = ["dep:tokenizers"]
bundle-weights = []
online-provisioning = []
embed-models = ["tokenizers-support"]
embed-ort = ["tokenizers-support", "ort"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "ocr_bench"
harness = false
