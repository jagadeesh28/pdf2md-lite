[package]
name = "pdfmd-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
lopdf = "0.46.0"
pdf-extract = "0.12.0"
sha2 = "0.10"
hayro = { version = "0.9.0", features = ["embed-fonts"] }
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.40.1"
tempfile = "3.12"
toml = "1.2.1"
tract-onnx = "0.23.10"
ort = { version = "2.0.0-rc.15", optional = true }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }

[features]
default = ["slanet-ort", "latex-ort", "gliner-ort", "embed-models", "embed-ort"]
ort = ["dep:ort"]
slanet-ort = ["ort"]
latex-ort = ["ort"]
gliner-ort = ["ort"]
embed-models = ["dep:tokenizers"]
embed-ort = ["embed-models", "ort"]

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "ocr_bench"
harness = false
