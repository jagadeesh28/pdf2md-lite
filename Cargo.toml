[workspace]
members = [
    "crates/engine",
    "crates/cli",
    "crates/server",
    "crates/desktop",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["pdfmd-lite contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23.1"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
lopdf = "0.46.0"
pdf-extract = "0.12.0"
sha2 = "0.10"
hayro = { version = "0.9.0", features = ["embed-fonts"] }
indicatif = "0.17"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.40.1"
tempfile = "3.12"
toml = "1.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "registry"] }
tract-onnx = "0.23.10"
ort = "2.0.0-rc.15"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
futures = "0.3"
criterion = "0.5"
tauri = "2"
tauri-build = "2"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
