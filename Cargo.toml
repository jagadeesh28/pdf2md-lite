[package]
name = "pdfmd-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
lopdf = "0.42.0"
pdf-extract = "0.12.0"
hayro = { version = "0.8.0", features = ["embed-fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tempfile = "3.12"
toml = "0.8"
tract-onnx = "0.23"

[features]
default = []
embed-models = []

[profile.dev]
debug = 1

[profile.test]
debug = 1
