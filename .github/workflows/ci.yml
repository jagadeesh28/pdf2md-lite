name: CI Quality Gates & Build Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gates:
    name: Code Health & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up build caching
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (rustfmt)
        run: cargo fmt --check

      - name: Strict clippy linting (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify benchmarks compilation
        run: cargo check --benches

      - name: Run test suite
        run: cargo test --all-targets

      - name: Cargo deny security & license audits
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
        continue-on-error: true

  build:
    name: ${{ matrix.name }}
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Builds ---
          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true

          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true

          # --- Windows Builds ---
          - name: Windows x86-64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true

          - name: Windows aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            test: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux cross-compilation)
        if: runner.os == 'Linux' && matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up build caching
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check compilation
        run: |
          ${{ matrix.linker_env }} cargo check --target ${{ matrix.target }}
        shell: bash

      - name: Build debug artifact
        run: |
          ${{ matrix.linker_env }} cargo build --target ${{ matrix.target }}
        shell: bash

      - name: Run unit tests (native targets)
        if: matrix.test == true
        run: |
          cargo test --target ${{ matrix.target }}
        shell: bash

      - name: Build release artifact
        run: |
          ${{ matrix.linker_env }} cargo build --release --target ${{ matrix.target }}
        shell: bash
