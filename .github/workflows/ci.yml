name: CI Build Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Builds ---
          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true

          - name: Linux x86-32
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            test: false
            apt_packages: gcc-multilib

          - name: Linux aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            test: false
            apt_packages: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc

          # --- Windows Builds ---
          - name: Windows x86-64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true

          - name: Windows x86-32
            os: windows-latest
            target: i686-pc-windows-msvc
            test: false

          - name: Windows aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            test: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux cross-compilation)
        if: runner.os == 'Linux' && matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up build caching
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check compilation
        run: |
          ${{ matrix.linker_env }} cargo check --target ${{ matrix.target }}
        shell: bash

      - name: Build debug artifact
        run: |
          ${{ matrix.linker_env }} cargo build --target ${{ matrix.target }}
        shell: bash

      - name: Run unit tests (native targets)
        if: matrix.test == true
        run: |
          cargo test --target ${{ matrix.target }}
        shell: bash

      - name: Build release artifact
        run: |
          ${{ matrix.linker_env }} cargo build --release --target ${{ matrix.target }}
        shell: bash
